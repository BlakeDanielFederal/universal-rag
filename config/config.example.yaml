# ============================================================================
# Universal RAG — project & source configuration.
# Copy to `config/config.yaml`. Secrets are referenced by ${ENV_VAR} and
# resolved from `.env` / the environment at load time (never inlined here).
#
# A "project workspace" is a first-class entity. Each project maps to one or
# more sources across providers; every ingested chunk is tagged with the
# project_id + source_id so retrieval scopes cleanly across all providers.
# ============================================================================

defaults:
  embedding_model: nomic-embed-text
  chunk:
    max_tokens: 512
    overlap_tokens: 64
  sync:
    strategy: incremental   # incremental | manual
    schedule: "0 * * * *"   # cron; used by the scheduler when enabled

# Every source supports `prune: true|false` (default true): after a successful
# sync, items deleted at the source are removed from the store. Set `prune: false`
# on a source to disable that reconciliation (e.g. a very large, costly listing).

projects:
  - id: apollo
    name: "Project Apollo"
    description: "Customer-facing analytics revamp."
    sources:
      - id: apollo-confluence
        provider: confluence
        # Confluence Data Center: base URL + PAT come from env (CONFLUENCE_*).
        spaces: ["APOLLO", "APOLLODOCS"]  # Confluence space keys to index
        include_labels: []                # optional: only pages with these labels

      - id: apollo-jira
        provider: jira
        # Jira Data Center: base URL + PAT come from env (JIRA_*).
        projects: ["APOL"]          # Jira project keys to index
        jql_extra: ""               # optional extra JQL ANDed onto the query
        include_comments: true      # fold issue comments into the indexed text

      - id: apollo-github
        provider: github
        repos: ["your-org/apollo-web", "your-org/apollo-api"]
        include:                    # which GitHub object types to ingest
          - pull_requests
          - issues
          - releases
          - readme

      - id: apollo-sharepoint
        provider: sharepoint
        # Microsoft Graph: app creds come from env (MSGRAPH_*).
        sites:                      # SharePoint sites as "host:/sites/Path"
          - "contoso.sharepoint.com:/sites/Apollo"
        onedrive_users: []          # optional: OneDrive owners by UPN, e.g. "ada@contoso.com"
        # Optional tuning (sensible defaults shown):
        # include_extensions: [".docx", ".pdf", ".pptx", ".md", ".txt", ".html", ".csv"]
        # max_file_mb: 10           # skip files larger than this
