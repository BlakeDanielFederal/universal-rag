[project]
name = "universal-rag"
version = "0.1.0"
description = "Local-first indexing, storage, and retrieval framework that ingests business context from multiple service providers (Confluence, Jira, GitHub, ...) into a per-project vector store and serves citation-ready, project-scoped hybrid retrieval over REST + MCP. Generation is left to consuming clients."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    # --- Config & validation ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # --- Persistence: Postgres + pgvector ---
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    # --- HTTP / connectors ---
    "httpx>=0.27",
    "tenacity>=8.3",          # retry/backoff for flaky provider APIs
    "beautifulsoup4>=4.12",   # Confluence storage (XHTML) -> text; web link extraction
    "trafilatura>=1.8",       # website main-content extraction (strip boilerplate)
    # --- File text extraction (SharePoint/OneDrive via MS Graph, local dirs) ---
    "python-docx>=1.1",       # .docx -> text
    "python-pptx>=0.6.23",    # .pptx -> text
    "pypdf>=4.0",             # .pdf  -> text
    # --- Embeddings / LLM (local-first via Ollama) ---
    "ollama>=0.3",
    # --- Interfaces ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0",
    "typer>=0.12",            # thin ops CLI (db-init/sync/query)
    # --- Scheduling (incremental-polling daemon) ---
    "apscheduler>=3.10,<4",
    # --- Observability ---
    "structlog>=24.1",
    "rich>=13.7",
]

[project.scripts]
urag = "universal_rag.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
